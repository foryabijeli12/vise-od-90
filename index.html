<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIŠE OD 90′ — HNL Portal</title>

  <style>
    :root {
      --bg-canvas: #090b0e;
      --bg-surface: #10141a;
      --bg-surface-2: #151a22;
      --bg-hover: #1b222c;
      --border-hairline: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #f4f6f9;
      --text-secondary: #9aa4b2;
      --text-muted: #667080;
      --accent: #e11d48;
      --accent-soft: rgba(225, 29, 72, 0.14);
      --live: #10b981;
      --live-soft: rgba(16, 185, 129, 0.14);
      --radius-card: 4px;
      --radius-pill: 2px;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse 90% 35% at 50% -10%, rgba(225, 29, 72, 0.08), transparent 70%),
        var(--bg-canvas);
      line-height: 1.55;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    /* Top Masthead */
    .masthead {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(9, 11, 14, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-hairline);
    }

    .masthead-inner {
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 20px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      text-decoration: none;
      color: var(--text-primary);
    }

    .brand-mark {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 31px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      line-height: 1;
    }

    .brand-mark span {
      color: var(--accent);
      font-style: italic;
    }

    .brand-handle {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-left: 1px solid var(--border-strong);
      padding-left: 12px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: color 0.15s ease;
    }

    .nav-links a:hover {
      color: var(--text-primary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 7px 12px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
